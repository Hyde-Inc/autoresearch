name: demand-forecasting-demo
description: |
  Forecast daily unit demand for 60 synthetic retail SKUs. Training data contains demand,
  promotion, price, category, and date. Produce one non-negative forecast for every requested
  SKU/date pair. The protected evaluator scores a 28-day validation horizon and a later hidden
  28-day holdout.
goal: Reduce WMAPE while retaining stable RMSE, bias, runtime, and hidden-holdout performance.
metric:
  name: wmape
  direction: min
secondary_metrics: [mape, rmse, bias_pct, runtime_s]
guardrails:
  - "rmse<=baseline*1.10"
  - "bias_pct within -8..8"
  - "runtime_s<=600"
director:
  model: openrouter/anthropic/claude-sonnet-4.6
  temperature: 0.35
agents:
  model: openrouter/anthropic/claude-sonnet-4.6
  count: 3
  timeout_s: 900
budget:
  max_experiments: 12
  train_timeout_s: 600
  rounds: 4
data:
  train: seed/data/train.parquet
  validation_actuals: private/validation.parquet
  holdout_actuals: private/holdout.parquet
  output: forecasts.parquet
  id_column: sku
  date_column: date
  target_column: demand
workspace:
  seed: seed
  runs: ../../runs
  allowed_paths: ["solution/"]
idea_hints:
  - Per-SKU auto-ARIMA or autoregression with weekly seasonality
  - XGBoost with lag, rolling, calendar, category, promotion, and price features
  - Chronos-Bolt-tiny zero-shot forecasting, optionally calibrated per SKU
  - Robust ensembles and bias calibration
