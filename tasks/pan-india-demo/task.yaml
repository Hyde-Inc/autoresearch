name: pan-india-demo
description: Forecast daily sales for 11526 items from an uploaded sales history (['sku_name',
  'sh', 'date', 'vertical', 'sales', 'adjusted_units', 'selling_price', 'mean_mrp',
  'last_30_days_mean_fsp', 'price_index_fsp_based', 'price_index_mrp_based', 'past15daysmean',
  'pe_flag', 'oos_flag', 'normal_day_flag', 'sales_filter_flag', 'midnight_oos_stock',
  'morning_oos_stock', 'afternoon_oos_stock', 'evening_oos_stock', 'night_oos_stock',
  'midnight_drr', 'morning_drr', 'afternoon_drr', 'evening_drr', 'night_drr', 'fgp_date',
  'lower_bound', 'upper_bound', 'expected_sales', 'final_adjusted_units', 'expected_sales_per_unit',
  'cap_bind_flag']). Produce one non-negative forecast per requested sku_name/date
  pair. A protected evaluator scores a 7-day validation window and a later hidden
  7-day holdout.
goal: Reduce forecast error on sales while keeping runtime and holdout stable.
metric:
  name: wmape
  direction: min
secondary_metrics:
- mape
- rmse
- bias_pct
- runtime_s
guardrails:
- runtime_s<=600
director:
  model: openrouter/moonshotai/kimi-k3
  temperature: 0.35
agents:
  model: openrouter/moonshotai/kimi-k3
  count: 3
  timeout_s: 1200
  budget_s: 3600
budget:
  max_experiments: 12
  train_timeout_s: 600
  rounds: 4
data:
  train: seed/data/train.parquet
  validation_actuals: private/validation.parquet
  holdout_actuals: private/holdout.parquet
  output: forecasts.parquet
  id_column: sku_name
  date_column: date
  target_column: sales
workspace:
  seed: seed
  runs: ../../runs
  allowed_paths:
  - solution/
idea_hints:
- Per-item seasonal-naive or exponential smoothing with weekly seasonality
- XGBoost with lag, rolling-mean, calendar, and price features
- Price-elasticity features from selling_price
- Robust ensembles and per-item bias calibration
